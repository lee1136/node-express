<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Books</title>    
    <link rel="stylesheet" href="common.css">
    
</head>
<body>    
    <header>
        <h1><a href="./">e-Books</a></h1>
        <div id="buttonContainer" class="dashboard">
            <button id="uploadBtn" style="display: none;" class="active">업로드</button> <!-- 관리자만 표시 -->
            <button id="signupBtn" style="display: none;" class="active">회원관리</button> <!-- 관리자만 표시 -->  
            <button id="logsBtn" style="display: none;" class="active"><a href="./log">로그</a></button>              
            <input type="text" id="searchInput" placeholder="검색..."> <!-- 검색 입력 필드 -->         
        </div>
                   
        <section id="categoryTabs">
            <button class="tab active"  data-category="all">전체</button>
            <button class="tab" data-category="ring">반지</button>
            <button class="tab" data-category="necklace">목걸이</button>
            <button class="tab" data-category="bracelet">팔찌</button>
            <button class="tab" data-category="earring">귀걸이</button>        
            <button class="tab cart_tab" data-category="cart">장바구니</button>
            <button id="logoutBtn" class="active">로그아웃</button>  
        </section>      
        
             

    </header>

    <section class="bg_opacity" >
        <div id="postList">
        <!-- 게시물 목록이 여기에 렌더링됩니다 -->
        </div>
    </section>

   
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="dashboard.js" type="module"></script>
    <script src="common.js" type="module"></script>    
</body>
</html>
