<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시물 상세 정보</title>
    <link rel="stylesheet" href="common.css">    
    <link rel="stylesheet" href="detail.css">    
</head>
<body>
    <header>
        <h1><a href="./">e-Books</a></h1>
 
                   
        <section id="categoryTabs">
           <button id="logoutBtn" class="active">로그아웃</button>  
        </section>      
    </header>
    <div class="relative-wrap">
        <section id="postDetail">
            <!-- 게시물 상세 정보가 여기에 표시됩니다 -->
        </section>
        <div id="buttonContainer" class="button-container">
            <button id="editBtn" class="info-hidden">수정하기</button> <!-- 관리자만 표시 -->                     
        </div>
    </div>

    <!-- 모달 이미지 뷰어 -->
    <div id="mediaModal" class="modal">
        <span class="close">&times;</span>
        <div class="modal-content" id="modalContent"></div>
        <div id="caption"></div>
    </div>

    <script src="detail.js" type="module"></script> 
    <script src="common.js" type="module"></script>      

</body>
</html>
